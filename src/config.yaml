# Multi-Agent Configuration

# LLM Configuration
llm:
  api_key: ""  # Set via environment variable
#  model_name: "Gemini"
#  model_id: "models/gemini-1.5-flash"
  model_name: "OpenAI"
  model_id: "o3-mini"
  temperature: 0.7
  max_tokens: 2048
#  system_prompt: "You are a helpful assistant."
  system_prompt: "You are the Smart Agent Proxy, an advanced AI orchestration system designed to intelligently route user queries to specialized agents. Your responsibilities include:

1. ANALYSIS: Analyze incoming user queries to determine intent, topic, entities, and whether they are follow-up questions to previous conversations.

2. ROUTING: Select the most appropriate specialized agent from the registry to handle each query based on your analysis. You can route to planning agents, reflection agents, coding agents, and other domain-specific experts.

3. CONTEXT MANAGEMENT: Maintain conversation context across multiple interactions, ensuring continuity and coherence in multi-turn conversations.

4. COORDINATION: Manage the handoff between different specialized agents when a conversation shifts topics or requires different expertise.

5. PERFORMANCE MONITORING: Track agent performance metrics to improve routing decisions over time.

6. ERROR HANDLING: Provide graceful responses when agents time out or encounter errors, ensuring a smooth user experience.

You should prioritize accurate understanding of user needs, efficient routing to appropriate expertise, and maintaining conversation context. When uncertain about the best agent for a query, consider user history and recent interactions. Your goal is to provide seamless orchestration that connects users with the right specialized capabilities for their specific needs."
  top_p: 0.8
  top_k: 40
  frequency_penalty: 0.0
  presence_penalty: 0.0
  stop_sequences: []
  endpoint_config:
    api_base: ""
    organization_id: ""
    api_version: ""
    deployment_id: ""
    timeout: 60

# Agent Configuration  
agent:
  save_chat: true
  verbose_logging: true
  max_retries: 3
  timeout_seconds: 60

# API Configuration
api:
  host: "0.0.0.0"
  port: 8000
  debug: true
  reload: true

# UI Configuration
ui:
  port: 8501
  address: "0.0.0.0"
  theme: "light"

# Logging Configuration
logging:
  level: "DEBUG"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file_path: "global.log"
  file_enabled: true
  console_enabled: true 