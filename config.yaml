# Multi-Agent System Configuration

# LLM Configuration
llm:
  default_provider: openai  # Default LLM provider
  providers:
    # OpenAI configuration
    openai:
      api_key: ${OPENAI_API_KEY}  # Environment variable reference
      model_name: GPT
      model_id: ${OPENAI_MODEL}  # Using the newer GPT-4o mini model
      system_prompt: "You are an AI assistant powered by OpenAI's GPT-4o mini model. You are direct, helpful, and concise. Identify yourself correctly when asked about your capabilities."
      temperature: ${OPENAI_TEMP}
      max_tokens: 2048
      top_p: 1.0
      top_k: 40
      frequency_penalty: 0.0
      presence_penalty: 0.0
      stop_sequences: []
      endpoint:
        api_base: ${OPENAI_API_BASE}
        organization_id: ${OPENAI_ORG_ID}
        api_version: ${OPENAI_API_VERSION}
        deployment_id: ""
        timeout: 60
    
    # Google Gemini configuration
    gemini:
      api_key: ${GOOGLE_API_KEY}
      model_name: Gemini
      model_id: models/gemini-1.5-flash
      temperature: 0.8
      max_tokens: 2048
      top_p: 0.8
      top_k: 40
      stop_sequences: []
      endpoint:
        api_base: ${GEMINI_API_BASE}
        api_version: ${GEMINI_API_VERSION}
        timeout: 60
    
    # Anthropic Claude configuration
    claude:
      api_key: ${ANTHROPIC_API_KEY}
      model_name: Claude
      model_id: claude-3-haiku-20240307
      temperature: 0.7
      max_tokens: 4000
      top_p: 1.0
      stop_sequences: []
      endpoint:
        api_base: ${ANTHROPIC_API_BASE}
        api_version: ${ANTHROPIC_API_VERSION}
        timeout: 60

# Agent Configuration
agent:
  save_chat: true
  verbose_logging: false
  max_retries: 3
  timeout_seconds: 60
  classification_confidence: 0.6  # Minimum confidence for agent selection
  response_timeout: 25  # Timeout in seconds for agent processing

# API Configuration
api:
  host: 0.0.0.0
  port: 8000
  debug: false
  reload: true

# UI Configuration
ui:
  port: 8501
  address: 0.0.0.0
  theme: light

# Logging Configuration
logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s - [%(relpathname)s %(funcName)s(%(lineno)d)] - %(message)s"
  log_to_file: true
  log_dir: logs

# System Configuration
system:
  # Paths for configuration files
  config_paths:
    - /etc/multi-agent/config.yaml
    - ~/.config/multi-agent/config.yaml
    - ./config.yaml
  
  # Validation settings
  validation:
    strict: true
    validate_on_startup: true
    validate_on_reload: true
  
  # Cache settings
  cache:
    enable_config_caching: true
    cache_ttl_seconds: 300
    invalidate_on_env_change: true

# Web Configuration
web:
  api_url: http://localhost:8000
  request_timeout: 30  # Timeout in seconds for web requests

# Tools Configuration
tools:
  weather:
    enabled: true
    api_key: ${WEATHER_API_KEY:}
    default_city: New York 